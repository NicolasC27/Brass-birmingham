<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Anti-FOUC theme bootstrap (platform « registre de jour »). Poses
         data-theme on <html> before first paint; every themed variable is
         scoped to .platform-root, so /game and legacy overlays are inert.
         Must mirror the resolution logic of src/platform/theme.ts. */
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('brassworks.theme.v1');
          if (saved === 'dark' || saved === 'light') t = saved;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        } catch (e) {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo-brassworks.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=IM+Fell+English+SC&family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>BRASSWORKS — A Midlands Industrial Game</title>
    <meta
      name="description"
      content="Canals, coal and iron. A playable browser adaptation of a Brass: Birmingham–style industrial network game, 1770–1850."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
