<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      /* Anti-FOUC theme bootstrap (platform « registre de jour »). Poses
         data-theme on <html> before first paint; every themed variable is
         scoped to .platform-root, so /game and legacy overlays are inert.
         Must mirror the resolution logic of src/platform/theme.ts. */
      (function () {
        /* nothing asked: the lamps go by the hour — the night's from eight to seven */
        var h = new Date().getHours();
        var t = h >= 20 || h < 7 ? 'dark' : 'light';
        /* a link may name the register (?theme=light|dark) and skip the
           arrival (?arrived): kept, so the choice holds on the next page */
        try {
          var q = new URLSearchParams(location.search);
          var asked = q.get('theme');
          if (asked === 'dark' || asked === 'light') localStorage.setItem('brassworks.theme.v1', asked);
          if (q.has('arrived')) localStorage.setItem('brassworks.arrived.v1', '1');
        } catch (e) {
          /* private mode */
        }
        try {
          var saved = localStorage.getItem('brassworks.theme.v1');
          if (saved === 'dark' || saved === 'light') t = saved;
        } catch (e) {
          /* private mode: the hour decides */
        }
        document.documentElement.setAttribute('data-theme', t);
        /* the masthead waits for its face rather than jumping from the
           fallback: the wordmark fades in once the fonts are there */
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () { document.documentElement.classList.add('fonts-ready'); });
        } else {
          document.documentElement.classList.add('fonts-ready');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo-blackrail.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=IM+Fell+English+SC&family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>BLACKRAIL — A Midlands Industrial Game</title>
    <meta
      name="description"
      content="Canals, coal and iron. A playable browser adaptation of a Brass: Birmingham–style industrial network game, 1770–1850."
    />
    <!-- the card a link shows elsewhere: the night plate, the title, the motto.
         __APP_URL__ is filled from VITE_APP_URL at build time (vite.config.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Blackrail" />
    <meta property="og:title" content="Blackrail — Journal des Midlands" />
    <meta property="og:description" content="Canaux, charbon & fer. Une gare, un journal, des tables contre des machines qui ne dorment jamais." />
    <meta property="og:image" content="__APP_URL__/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#EFE8D6" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
